<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>方程式天秤教材 上皿版</title>

<style>
body{
    font-family:sans-serif;
    background:#eef4ff;
    text-align:center;
}

button,input,select{
    margin:4px;
    padding:8px;
}

.area{
    display:flex;
    justify-content:center;
    gap:100px;
    margin-top:20px;
}

.pan{
    width:280px;
    min-height:130px;
    background:#fff;
    border:4px solid #555;
    padding:8px;
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    align-items:center;
}

.item{
    font-size:34px;
    margin:4px;
    cursor:grab;
}

.beam{
    width:750px;
    height:10px;
    background:#333;
    margin:10px auto 0;
    transform-origin:center;
    transition:.4s;
}

.pivot{
    font-size:60px;
    line-height:1;
}

.trash{
    width:140px;
    margin:20px auto;
    padding:15px;
    border:3px dashed red;
    border-radius:12px;
}

.msg{
    font-size:22px;
    font-weight:bold;
}
</style>
</head>

<body>

<h1>⚖️ 一元一次方程式 天秤教材</h1>

<button onclick="showAns()">答え</button>

<div id="info"></div>

</div>

<div id="beam" class="beam"></div>

<div class="pivot">△</div>

<div id="trash"
